[project]
name = "retina-coursework"
version = "1.1.0"
description = "Two reproducible diabetic retinopathy coursework projects"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.12.1+cpu", "torchvision==0.27.1+cpu", "numpy==2.4.4",
    "scikit-learn==1.8.0", "matplotlib==3.10.8", "pillow==13.0.0",
    "pydantic==2.13.4", "fastapi==0.136.1", "uvicorn==0.47.0",
    "python-multipart==0.0.33", "httpx2[http2,brotli,zstd]==2.16.0",
    "reportlab==5.1.0", "typer==0.27.1", "rich==15.0.0",
]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.21", "basedpyright==1.39.9", "scikit-learn-stubs==0.0.3"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "FBT001", "FBT002", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "PLR2004", "SLF001", "ARG"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["retina", "model_runtime"]
exclude = [".venv", "data", "outputs"]
